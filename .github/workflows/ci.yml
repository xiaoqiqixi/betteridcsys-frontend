name: Finance frontend checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Locked dependencies, types, tests, production build and formatting
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm run format:check
      - name: Production builds must not alter reviewed source
        run: |
          set -euo pipefail
          [[ -z $(git ls-files '*.tsbuildinfo') ]] || { echo 'Generated TypeScript caches must not be tracked.' >&2; exit 1; }
          [[ -z $(git status --porcelain=v1 --untracked-files=all) ]] || { echo 'Build changed the reviewed source tree.' >&2; exit 1; }
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Static release package contract and real built-site inventory
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/test_frontend_bundle.py
          python3 scripts/test_release_source.py
          package="$RUNNER_TEMP/finance-frontend-package-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 scripts/frontend_bundle.py build \
            --source-root "$GITHUB_WORKSPACE" --output "$package" \
            --source-sha "$GITHUB_SHA" --source-date-epoch "$(git show -s --format=%ct HEAD)"
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          core=$(node -p 'JSON.parse(require("fs").readFileSync("compatibility.json", "utf8")).core_version')
          python3 scripts/frontend_bundle.py inspect \
            --manifest "$package/FRONTEND.json" --archive "$package/aster-finance-frontend-$version.tar.gz" \
            --expected-source-sha "$GITHUB_SHA" --expected-core-version "$core"
      - name: Retain exact-source frontend candidate for paired backend acceptance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: finance-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/finance-frontend-package-${{ github.run_id }}-${{ github.run_attempt }}/FRONTEND.json
            ${{ runner.temp }}/finance-frontend-package-${{ github.run_id }}-${{ github.run_attempt }}/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          overwrite: false
